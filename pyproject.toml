[project]
name = "vox"
version = "0.1.0"
description = "Lightweight speech-to-text with LLM agent integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "dasbus>=1.7",
    "PyGObject>=3.42.0",
    "textual>=0.47.0",
    "litellm>=1.30.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
]

[project.scripts]
vox = "vox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
